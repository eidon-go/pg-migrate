version: 2

project_name: pg-migrate

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - id: pg-migrate
    main: ./cmd/pg-migrate
    binary: pg-migrate
    env:
      # Statically linked, so the binary runs on scratch and alpine images.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # No demand for 32-bit or Windows/arm64; keeps the release page readable.
      - goos: windows
        goarch: arm64

archives:
  - id: default
    ids: [pg-migrate]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

# Keyless signing through Sigstore: the workflow's OIDC identity is bound into a
# short-lived certificate and recorded in the public Rekor log, so there is no
# private key to store, rotate or lose.
#
# Only checksums.txt is signed — every artifact is listed in it with its hash,
# so one signature covers the whole release and verification stays a two-step
# check anyone can follow.
signs:
  - cmd: cosign
    # cosign v3 replaced the separate .sig/.pem pair with a single bundle that
    # carries the signature, the certificate and the Rekor inclusion proof.
    # --output-signature and --output-certificate are deprecated and now refuse
    # to run alongside the new format.
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

# Images are signed by digest, which is what a deployment actually pulls.
docker_signs:
  - cmd: cosign
    args:
      - sign
      - "--yes"
      - "${artifact}"
    artifacts: all
    output: true

# The CLI is most often run as a Kubernetes init container, so a multi-arch
# image matters — the arch has to match the node. dockers_v2 builds every
# platform and assembles the manifest itself.
dockers_v2:
  - id: pg-migrate
    ids: [pg-migrate]
    dockerfile: Dockerfile.goreleaser
    images:
      - ghcr.io/eidon-go/pg-migrate
    tags:
      - "{{ .Version }}"
      # An empty tag is ignored, so `latest` follows stable releases only —
      # a prerelease must not move it.
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "PostgreSQL migration library and CLI"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.source: "https://github.com/eidon-go/pg-migrate"
      org.opencontainers.image.licenses: MIT
    annotations:
      org.opencontainers.image.base.name: "{{ .BaseImage }}"

# The changelog shipped with the release comes from git-cliff via
# --release-notes, so GoReleaser must not build one of its own.
changelog:
  disable: true

release:
  github:
    owner: eidon-go
    name: pg-migrate
  prerelease: auto
  footer: |
    ---

    **Full changelog**: https://github.com/eidon-go/pg-migrate/blob/main/CHANGELOG.md

    Install the CLI:

    ```bash
    go install github.com/eidon-go/pg-migrate/cmd/pg-migrate@{{ .Tag }}
    ```

    ### Verifying this release

    Artifacts are signed with [cosign](https://docs.sigstore.dev/) keyless: no
    private key exists, the signature is bound to this workflow's identity and
    recorded in the public Rekor transparency log.

    ```bash
    cosign verify-blob checksums.txt \
      --bundle checksums.txt.bundle \
      --certificate-identity-regexp '^https://github\.com/eidon-go/pg-migrate/\.github/workflows/release\.yml@refs/tags/' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com

    # then check the archive against the verified checksums
    sha256sum --check --ignore-missing checksums.txt
    ```

    The container image is signed by digest:

    ```bash
    cosign verify ghcr.io/eidon-go/pg-migrate:{{ .Version }} \
      --certificate-identity-regexp '^https://github\.com/eidon-go/pg-migrate/\.github/workflows/release\.yml@refs/tags/' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    ```

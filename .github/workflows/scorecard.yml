name: Scorecard

# OpenSSF Scorecard rates the repository's security practices — branch
# protection, pinned dependencies, signed releases, and so on. Results land in
# the Security tab and feed the badge in the README.
on:
  branch_protection_rule:
  schedule:
    - cron: "39 5 * * 2"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF result
      id-token: write # publish results for the badge
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          # Required for the public badge; the results are published to the
          # OpenSSF API.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

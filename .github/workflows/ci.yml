name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets a run be started by hand when a push event was lost — GitHub throttles
  # webhooks during an Actions incident, and a branch can otherwise sit with no
  # checks at all.
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete. main is never cancelled:
# its runs are what the release job's history is read from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  # The PR title becomes the squashed commit message, and git-cliff builds the
  # changelog from those. A title that does not parse as a Conventional Commit
  # would drop the change from the release notes silently.
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Must match the commit_parsers in cliff.toml.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            style
          requireScope: false
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: |
            The subject "{subject}" must start lowercase and not end with a period.

  # Flags dependencies a PR adds that carry known vulnerabilities or a licence
  # incompatible with MIT, before the merge rather than after.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Fails when go.mod/go.sum are not what `go mod tidy` would produce,
      # without writing anything.
      - name: go mod tidy -diff
        run: go mod tidy -diff

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          args: --timeout=5m

      # Integration tests are behind a build tag, so the default run does not
      # see them at all.
      - name: golangci-lint (integration build tag)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          args: --timeout=5m --build-tags=integration ./test/...

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ${{ env.GO_VERSION }}
          repo-checkout: false

      - name: betteralign
        run: go run github.com/dkorunic/betteralign/cmd/betteralign@v0.14.3 ./...

      - name: nilaway
        run: go run go.uber.org/nilaway/cmd/nilaway@latest ./...

  test-unit:
    name: Unit tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC upload to Codecov, in place of a stored token
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25", "1.26"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 -timeout 5m -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

      # One upload is enough; the second Go version would only duplicate it.
      #
      # OIDC instead of a stored CODECOV_TOKEN: nothing long-lived to leak or
      # rotate. The trade-off is that a PR from a fork cannot mint an OIDC token,
      # so coverage from outside contributors lands only once it reaches main.
      - name: Upload coverage
        if: matrix.go == '1.25'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          use_oidc: true
          fail_ci_if_error: false

  # The SQL scanner and the directive parser decide what actually runs against a
  # database, so they get a short fuzzing pass on every change. The corpus that
  # ships in testdata/ is replayed by the unit job as ordinary tests.
  test-fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzSplitSQLStatements, FuzzParseDirectiveHeader, FuzzQuoteIdentifier]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Fuzz ${{ matrix.target }}
        run: go test ./internal/migrator/ -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime=90s

      # A crasher is written to testdata/fuzz/; keep it so the failure can be
      # reproduced and turned into a regression test.
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: internal/migrator/testdata/fuzz/
          if-no-files-found: ignore

  test-integration:
    name: Integration (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The README promises PostgreSQL 12+, so every supported version is
        # exercised rather than assumed.
        postgres: ["12", "13", "14", "15", "16", "17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_HOST: localhost
      TEST_POSTGRES_PORT: "5432"
      TEST_POSTGRES_USER: postgres
      TEST_POSTGRES_PASSWORD: postgres
      TEST_POSTGRES_ADMIN_DB: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Each test creates and drops its own database, so no per-job container
      # orchestration is needed beyond this service.
      - name: Integration tests
        run: go test -tags=integration -race -count=1 -timeout 10m ./test/...

  # Single required status check: branch protection points at this one job
  # instead of tracking every matrix leg by name.
  ci-ok:
    name: CI OK
    if: always()
    needs: [pr-title, dependency-review, lint, test-unit, test-fuzz, test-integration]
    runs-on: ubuntu-latest
    steps:
      # pr-title and dependency-review are skipped on push to main; a skip is
      # not a failure.
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All checks passed."

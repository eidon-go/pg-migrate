name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  # A tag push skips the PR checks entirely, so re-run them here. Nothing is
  # published unless the tagged commit is green on its own.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_HOST: localhost
      TEST_POSTGRES_PORT: "5432"
      TEST_POSTGRES_USER: postgres
      TEST_POSTGRES_PASSWORD: postgres
      TEST_POSTGRES_ADMIN_DB: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Unit tests
        run: go test -race -count=1 -timeout 5m ./...

      - name: Integration tests
        run: go test -tags=integration -race -count=1 -timeout 10m ./test/...

  release:
    name: Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload binaries
      packages: write # push container images to ghcr.io
      id-token: write # keyless signing: mint the OIDC token cosign binds into the certificate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git-cliff reads the whole commit history to build the changelog.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # GoReleaser shells out to syft for the `sboms` section; it is not on the
      # runner by default and the release fails at the very last step without it.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # Same for cosign, used by the `signs` and `docker_signs` sections.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Required for the arm64 image: the runner is amd64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Notes for this tag only, attached to the GitHub Release. The cumulative
      # CHANGELOG.md is maintained on main by `make changelog-release`.
      - name: Generate release notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean --release-notes=RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # CHANGELOG.md is deliberately NOT written back to main from here.
      #
      # The main ruleset requires a pull request, and the GitHub Actions app
      # cannot be granted a bypass on a repository-owned ruleset. Pushing from
      # CI would therefore need a personal access token with admin rights
      # stored as a secret — a standing key that can rewrite the default branch,
      # in exchange for saving one local command.
      #
      # Instead `make changelog-release` regenerates the file as part of cutting
      # a release, before the tag is pushed. See CONTRIBUTING.md.
      - name: Check CHANGELOG.md is up to date
        run: |
          if ! grep -q "${GITHUB_REF_NAME#v}" CHANGELOG.md; then
            echo "::warning::CHANGELOG.md does not mention ${GITHUB_REF_NAME}." \
                 "Run 'make changelog-release' and commit before tagging."
          fi
